<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>她想说的话</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one column "game cabinet" — pixel room on top, dialogue box below, like a handheld RPG at night. */
:root{
  --night:#16131f;      /* page ground */
  --panel:#231d33;      /* dialogue box */
  --ink:#f3e9dc;        /* text */
  --dim:#a99fbd;        /* secondary text */
  --lamp:#ffc96b;       /* warm accent: openness */
  --rose:#ff7a93;       /* heart / patience */
  --cold:#7aa7ff;       /* good-tag */
  --bad:#ff8a5c;        /* bad-tag */
  --edge:#0b0910;       /* pixel border */
  --f-pixel:"Silkscreen", ui-monospace, monospace;
  --f-title:"ZCOOL QingKe HuangYou", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-title);font-weight:400;font-size:clamp(28px,6vw,40px);letter-spacing:.06em;margin:0;line-height:1.1;color:var(--lamp);text-shadow:3px 3px 0 var(--edge)}
.sub{font-family:var(--f-pixel);font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}

.px{border:3px solid var(--edge);box-shadow:0 0 0 3px #3a3052, 6px 6px 0 3px var(--edge)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;inset:8px 8px auto 8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{background:rgba(11,9,16,.78);border:2px solid var(--edge);padding:4px 8px;display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-size:10px;letter-spacing:.08em}
.chip b{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:0}
.bar{display:flex;gap:2px}
.bar i{width:7px;height:10px;background:#3a3052;display:block}
.bar i.on{background:var(--lamp)}
.hearts{display:flex;gap:3px;font-size:13px;line-height:1}
.hearts span{color:var(--rose)}
.hearts span.off{color:#4a3f5e}

.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clue{background:var(--panel);border:2px dashed #4a3f5e;padding:6px 10px;font-size:13px;color:var(--dim);min-width:0;display:flex;gap:8px;align-items:center}
.clue small{font-family:var(--f-pixel);font-size:9px;color:#6d6385;flex:none}
.clue.on{border-style:solid;border-color:var(--lamp);color:var(--ink)}
.clue.on small{color:var(--lamp)}
.clue.flash{animation:flash .9s steps(3) 2}
@keyframes flash{50%{background:#4a3b22}}

.box{background:var(--panel);padding:16px 18px 18px;min-height:220px;display:flex;flex-direction:column;gap:12px}
.speaker{font-family:var(--f-title);font-size:18px;color:var(--lamp);letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.speaker.me{color:var(--cold)}
.speaker em{font-style:normal;font-family:var(--f-pixel);font-size:9px;color:var(--dim);letter-spacing:.12em}
.line{font-size:17px;line-height:1.75;min-height:3.5em;text-wrap:pretty}
.line .cursor{display:inline-block;width:.5em;height:1em;background:var(--ink);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.opts{display:grid;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;background:#2e2643;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.55;transition:transform .05s}
.opt:hover,.opt:focus-visible{background:#3b3157;outline:none;border-color:var(--lamp)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.opt kbd{font-family:var(--f-pixel);font-size:10px;background:var(--edge);color:var(--lamp);padding:2px 6px;flex:none;margin-top:2px}
.opt span{min-width:0}
.note{border-left:4px solid var(--cold);background:#1b1628;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.note.bad{border-color:var(--bad)}
.note.mid{border-color:var(--lamp)}
.note .tag{font-family:var(--f-pixel);font-size:10px;letter-spacing:.1em;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note .tag b{font-family:var(--f-body);font-size:13px;letter-spacing:0}
.note p{margin:0;font-size:14px;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.go{background:var(--lamp);color:var(--edge);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:8px 16px;font-weight:700;font-size:14px}
.go.ghost{background:transparent;color:var(--ink)}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}

.intro p{margin:0 0 8px;color:var(--dim);font-size:14px}
.intro p strong{color:var(--ink);font-weight:600}
.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chap{text-align:left;background:#2e2643;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chap:hover,.chap:focus-visible{border-color:var(--lamp);outline:none;background:#3b3157}
.chap small{font-family:var(--f-pixel);font-size:9px;color:var(--dim);letter-spacing:.12em}
.chap strong{font-family:var(--f-title);font-weight:400;font-size:20px;color:var(--lamp);letter-spacing:.04em}
.chap span{font-size:13px;color:var(--dim)}
.chap .done{font-family:var(--f-pixel);font-size:9px;color:var(--cold)}

.end h2{font-family:var(--f-title);font-weight:400;font-size:28px;margin:0;color:var(--lamp);letter-spacing:.06em}
.end .quote{font-size:16px;margin:0;border-left:4px solid var(--lamp);padding-left:12px}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.recap li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;align-items:start}
.recap li i{font-style:normal;font-family:var(--f-pixel);font-size:9px;padding:2px 6px;border:2px solid var(--edge);white-space:nowrap}
.recap li i.g{background:var(--cold);color:var(--edge)}
.recap li i.m{background:var(--lamp);color:var(--edge)}
.recap li i.b{background:var(--bad);color:var(--edge)}
.recap li span{color:var(--dim);min-width:0}
.tip{background:#1b1628;padding:12px;border:2px solid #4a3f5e}
.tip small{font-family:var(--f-pixel);font-size:9px;color:var(--lamp);letter-spacing:.12em}
.tip p{margin:4px 0 0}
.label{font-family:var(--f-pixel);font-size:10px;letter-spacing:.12em;color:var(--dim)}
footer{font-size:12px;color:#6d6385;text-align:center}
@media (max-width:560px){
  .chapters,.clues{grid-template-columns:1fr}
  .line{font-size:16px}
  .hud .chip{font-size:9px;padding:3px 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>她想说的话</h1>
    <a class="sub" href="../" style="text-decoration:none">← 两个人的练习室</a>
  </header>

  <div class="stage px">
    <canvas id="cv" width="192" height="108" aria-label="夜晚的房间，你和她站在两端"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="chip">心门 <span class="bar" id="bar"></span></div>
      <div class="chip">耐心 <span class="hearts" id="hearts"></span></div>
      <div class="chip">ROUND <b id="rnd">1/4</b></div>
    </div>
  </div>

  <div class="clues" id="clues" hidden></div>

  <section class="box px" id="box" aria-live="polite"></section>

  <footer>数字键 1–4 选择 · 空格 / 回车 继续</footer>
</div>

<script>
// ---------- content ----------
// d: 心门变化  h: 耐心变化  k: g 好 / m 一般 / b 不好
const STORIES = [
{
  id:'a', name:'看不见的我', blurb:'她说想了很久。可你完全不知道从哪天开始的。',
  intro:'我们分手吧。我想了很久了。',
  clues:['她最近很少跟你分享生活了','上个月她升职那天，你没抬头','她觉得自己在你这里是透明的'],
  rounds:[
    {opts:[
      {t:'你想了很久……这段时间你一个人扛着这些，一定很难受吧？',r:'……嗯。挺难受的。',d:15,h:0,k:'g',tag:'共情',n:'先接住她的情绪，再谈原因。她需要先感觉到"被看见"。'},
      {t:'为什么？我做错什么了？你直接说。',r:'你看，又要我给你列清单。',d:-5,h:0,k:'m',tag:'急着追问',n:'"直接说"把压力全推给对方，听起来更像审问，不像关心。'},
      {t:'是不是有别人了？',r:'……你到现在都觉得问题在我这里。',d:-15,h:-1,k:'b',tag:'猜疑',n:'第一反应是怀疑对方，等于告诉她：你的痛苦不重要，我只关心我有没有被背叛。'},
      {t:'好好的怎么突然这样，别闹了，明天还要上班呢。',r:'我没有在闹。',d:-10,h:-1,k:'b',tag:'轻视',n:'"别闹了"否定了她认真思考过的决定。'}
    ]},
    {her:'我不知道从哪里说起。说了你可能也不懂。',opts:[
      {t:'没关系，从哪里开始都行。我不打断你，就听着。',r:'……那我试试。',d:15,h:0,k:'g',tag:'倾听',n:'给对方安全感：你不会打断、不会反驳。很多话只在这种时候才说得出口。'},
      {t:'你不说我怎么懂？',r:'我说过的。很多次。',d:-10,h:-1,k:'b',tag:'指责',n:'这句话把"不懂"的责任推回给了她。'},
      {t:'那你想好了再说。我先去打会儿游戏，冷静一下。',r:'……好。你去吧。',d:-15,h:-1,k:'b',tag:'回避',n:'在她最需要你在场的时候离开，恰好重演了问题本身。'},
      {t:'是不是因为我最近太忙了？',r:'忙……也不全是。',d:5,h:0,k:'m',tag:'封闭式猜测',n:'有在反思是好的。但"是不是"只能换来是或否，开放式提问会让她说得更多。'}
    ]},
    {her:'上个月我升职了。你记得那天你说了什么吗？',opts:[
      {t:'……我不太记得了。你愿意告诉我吗？我想知道那天你的感受。',r:'你在打游戏，头都没抬，说了句"嗯，不错"。我买的蛋糕放冰箱里，第二天扔了。',d:15,h:0,k:'g',tag:'诚实 + 好奇',n:'承认自己不记得，比编一个答案更诚实。接着去问"感受"，而不是问"事实"。'},
      {t:'我当然记得，我说恭喜你啊！',r:'你说的是"嗯，不错"。眼睛都没离开屏幕。',d:-10,h:-1,k:'b',tag:'找补',n:'急着证明自己没错，会让她觉得你在乎的是"不被指责"，不是她。'},
      {t:'这都一个月前的事了，你怎么还记着。',r:'对你来说是一件小事。',d:-15,h:-1,k:'b',tag:'轻视',n:'她记得，说明它对她很重要。说"还记着"等于说她小题大做。'},
      {t:'那天……我是不是让你很失望？',r:'失望……算是吧。那天我买了蛋糕，你在打游戏。',d:12,h:0,k:'g',tag:'承认',n:'主动承认可能伤害了她，能让她放下一部分防备。'}
    ]},
    {her:'不只是那一次。现在跟你说话，我经常觉得像在对着空气。',opts:[
      {t:'像对着空气……那一定很孤单。你从什么时候开始这样觉得的？',r:'大概半年前吧。后来我就不怎么跟你分享了，反正你也不会抬头。',d:15,h:0,k:'g',tag:'复述 + 好奇',n:'复述她的原话，说明你真的听进去了；再问"从什么时候"，邀请她讲下去。'},
      {t:'我工作压力也很大啊，回家就想放松一下。',r:'嗯。你的累总是比我的重要。',d:-10,h:-1,k:'b',tag:'自我中心',n:'你的压力是真的，但现在把它拿出来，就成了比较谁更委屈。'},
      {t:'那我以后少玩点游戏就是了。',r:'这不是游戏的问题。',d:3,h:0,k:'m',tag:'急着解决',n:'马上给方案，跳过了她的感受。她会觉得自己被"打包处理"了。'},
      {t:'你也可以直接叫我啊，你不说我怎么知道。',r:'我叫过。你说"等这把打完"。',d:-10,h:-1,k:'b',tag:'推卸',n:'把"没注意到"变成"她没说清楚"，她只会更累。'}
    ]}
  ],
  reveal:'我不是要你多浪漫。我只是希望我开心或者难过的时候，你会抬头看我一眼。这半年，我觉得自己在你这里是透明的。我不想一直透明下去。',
  partial:'……我只是觉得，我们之间好像没什么话了。今天就先这样吧。',
  closed:'算了。我没力气解释了。',
  finals:[
    {t:'谢谢你告诉我。这半年是我没看见你，让你一个人孤单。以后你说话的时候，我会放下手机看着你。这周六，能让我补上那个蛋糕吗？我想听你讲讲升职以后的事。',r:'……那你要认真听哦。我有好多话攒着没说。',k:'g',end:'good'},
    {t:'我保证以后全都改，再给我一次机会好不好？',r:'"保证"我听过。你做给我看吧。',k:'m',end:'mid'},
    {t:'可你也没告诉我你这么难受啊。',r:'你看，又是这样。',k:'b',end:'bad'}
  ],
  tip:'下次见面，放下手机，看着对方问一句："今天过得怎么样？我想听。"'
},
{
  id:'b', name:'远方的 offer', blurb:'她说下个月可能要去成都。你以为这就是原因。',
  intro:'我们分手吧。下个月我可能要去成都了。',
  clues:['她拿到了一个等了两年的机会','她不敢告诉你','她怕你的以后里没有她'],
  rounds:[
    {opts:[
      {t:'成都？……这件事你一定考虑了很久。你愿意跟我说说吗？',r:'……嗯。我可以说。',d:15,h:0,k:'g',tag:'好奇',n:'先对她的决定感兴趣，而不是先对结果下判断。'},
      {t:'去成都？那我怎么办？',r:'你看，你第一反应是你自己。',d:-10,h:-1,k:'b',tag:'自我中心',n:'你的不安是真的，但她此刻需要的是被问一句"你怎么想"。'},
      {t:'就因为一份工作就分手？异地又不是不行。',r:'你根本不知道这份工作对我意味着什么。',d:-10,h:-1,k:'b',tag:'轻视',n:'"就因为"把她的重要决定说成了小事。'},
      {t:'什么时候的事？你怎么现在才说？',r:'我提过的。你不记得而已。',d:-3,h:0,k:'m',tag:'带刺的追问',n:'问时间没问题，但"怎么现在才说"里带着责怪。'}
    ]},
    {her:'是一个我等了两年的机会。三月份面试的。',opts:[
      {t:'两年……这对你来说一定很重要。拿到它的时候，你开心吗？',r:'开心。开心得在地铁上哭了。',d:15,h:0,k:'g',tag:'共情',n:'先分享她的喜悦。哪怕结果对你不利，她的成就仍然值得被庆祝。'},
      {t:'三月份？你瞒了我半年？',r:'……我就知道你会这么说。',d:-15,h:-1,k:'b',tag:'指责',n:'"瞒"这个字把她放在了被告席上。'},
      {t:'那恭喜你。看来你早就想好了。',r:'你非要这样说话吗？',d:-8,h:-1,k:'b',tag:'赌气',n:'阴阳怪气的祝福会关上她刚刚打开的门。'},
      {t:'我记得你说过想换个平台，没想到是外地。',r:'我说过很多次。每次你都说"到时候再说"。',d:7,h:0,k:'m',tag:'回忆',n:'记得她说过的话是加分项。但别停在"没想到"，再往前问一步。'}
    ]},
    {her:'我当然开心。可是我不敢告诉你。',opts:[
      {t:'不敢……是我让你觉得，说出来会有什么后果吗？',r:'我怕你让我别去。更怕你根本无所谓。',d:15,h:0,k:'g',tag:'好奇 + 承担',n:'把"不敢"当成关于你们关系的信号去问，而不是当成她的问题。'},
      {t:'有什么不敢的，我又不会拦你。',r:'那你会跟我去吗？……你看，你答不出来。',d:-10,h:-1,k:'b',tag:'否认感受',n:'"有什么不敢的"等于告诉她：你的害怕是多余的。'},
      {t:'你是不是早就想离开我了？',r:'……如果我想离开，还会站在这里跟你说吗？',d:-15,h:-1,k:'b',tag:'猜疑',n:'把她的犹豫解读成背叛，会让她后悔开口。'},
      {t:'嗯，我能理解。',r:'你理解什么呢？',d:3,h:0,k:'m',tag:'空泛共情',n:'没有内容的"我理解"，听起来像在应付。说出你理解到的具体东西。'}
    ]},
    {her:'每次我说到以后，你都说"到时候再说"。',opts:[
      {t:'我好像一直在回避谈以后。你每次听到"到时候再说"，是什么感觉？',r:'像是我的以后里有你，你的以后里没有我。',d:15,h:0,k:'g',tag:'承担 + 好奇',n:'先认下自己的模式，再问它在她那里留下了什么。'},
      {t:'我那是不想给你压力。',r:'可是你不说，我压力更大。',d:-10,h:-1,k:'b',tag:'辩解',n:'动机也许是好的，但此刻解释动机，会盖过她的感受。'},
      {t:'那现在就说！你到底想怎么样？',r:'……我不想在你这样的语气里说。',d:-10,h:-1,k:'b',tag:'急躁',n:'逼问会让对方本能地关门。'},
      {t:'以后的事本来就很难说嘛。',r:'嗯。所以我先替你说了。',d:-8,h:-1,k:'b',tag:'回避',n:'这正是她最怕听到的那句话的变体。'}
    ]}
  ],
  reveal:'我不是因为成都才要分手。我是怕我开口问"你愿不愿意一起想办法"，你又会说"到时候再说"。与其那样被拒绝，不如我先走。',
  partial:'……其实也不全是因为工作。算了，等我想清楚再说吧。',
  closed:'就这样吧。我会自己处理好。',
  finals:[
    {t:'我不想再说"到时候再说"了。成都对你很重要，你对我也很重要。今晚我们就坐下来，把异地、搬家、我的工作，一样一样摊开谈，好吗？',r:'……好。我其实早就列了一张表，一直不敢拿出来。',k:'g',end:'good'},
    {t:'我支持你去。不管结果怎样，我都尊重你的决定。',r:'谢谢。可我想要的不只是"尊重"……我想要你在里面。',k:'m',end:'mid'},

// ---------- typewriter ----------
let typing = null;
function type(el, text, done){
  if (typing) clearInterval(typing.iv);
  if (reduce){ el.textContent = text; done && done(); return; }
  let i = 0; el.textContent = '';
  const cur = document.createElement('span'); cur.className = 'cursor';
  typing = {finish(){ clearInterval(this.iv); el.textContent = text; typing = null; done && done(); }};
  typing.iv = setInterval(() => {
    i++; el.textContent = text.slice(0, i); el.appendChild(cur);
    if (i >= text.length) typing.finish();
  }, 38);
}

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- HUD ----------
function hud(){
  const on = S.screen === 'play';
  $('hud').hidden = !on; $('clues').hidden = !on;
  if (!on) return;
  const n = Math.round(S.open / 10);
  $('bar').innerHTML = Array.from({length:10}, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
  $('hearts').innerHTML = [0,1,2].map(i => `<span class="${i < S.hearts ? '' : 'off'}">♥</span>`).join('');
  const st = story();
  $('rnd').textContent = S.round < st.rounds.length ? `${S.round+1}/${st.rounds.length}` : 'FINAL';
  $('clues').innerHTML = st.clues.map((c, i) => `<div class="clue ${i < S.clues ? 'on' : ''}" id="clue${i}"><small>#${i+1}</small><span>${i < S.clues ? esc(c) : '心门 ' + CLUE_AT[i] + ' 解锁'}</span></div>`).join('');
}

// ---------- screens ----------

function start(id){

function speaker(who, sub){
  return `<div class="speaker ${who === '你' ? 'me' : ''}">${who}${sub ? `<em>${sub}</em>` : ''}</div>`;
}

function ask(){
  S.step = 'ask'; hud();

  box.innerHTML = speaker('她') + `<div class="line" id="line"></div><div class="opts" id="opts" hidden></div>`;
  const opts = shuffle(r.opts);
  $('opts').innerHTML = opts.map((o, i) => `<button class="opt" data-i="${r.opts.indexOf(o)}"><kbd>${i+1}</kbd><span>${esc(o.t)}</span></button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.i));
  type($('line'), line, () => { $('opts').hidden = false; });
}

function pick(i){
  const st = story(), o = st.rounds[S.round].opts[i];
  S.open = Math.max(0, Math.min(100, S.open + o.d));
  S.hearts = Math.max(0, S.hearts + o.h);
  S.log.push({t:o.t, k:o.k, tag:o.tag});
  S.last = o;
  emote = o.k === 'g' ? 'heart' : o.k === 'm' ? 'dots' : 'cloud'; emoteT = 0;
  const before = S.clues;
  while (S.clues < 3 && S.open >= CLUE_AT[S.clues]) S.clues++;
  S.step = 'reply'; hud();
  for (let c = before; c < S.clues; c++) $('clue'+c)?.classList.add('flash');
  showReply(o);
}

function showReply(o){
  const sign = o.d > 0 ? '+' + o.d : o.d;
  const cls = o.k === 'g' ? '' : o.k === 'm' ? 'mid' : 'bad';
  box.innerHTML = speaker('你') + `<div class="line" style="color:var(--dim);min-height:0;font-size:15px">${esc(o.t)}</div>`
    + speaker('她') + `<div class="line" id="line"></div>
    <div id="after" hidden>
      <div class="note ${cls}">
        <div class="tag">${o.k === 'g' ? 'GOOD' : o.k === 'm' ? 'OK' : 'OUCH'} · <b>${esc(o.tag)}</b> · 心门 ${sign}${o.h ? ' · 耐心 ' + o.h : ''}</div>

  type($('line'), o.r, () => { $('after').hidden = false; $('next').focus({preventScroll:true}); $('next').onclick = next; });
}

function next(){
  const st = story();
  if (S.hearts <= 0) return ending('leave', '……我先走了。');
  S.round++;
  if (S.round < st.rounds.length) return ask();
  hud();
  if (S.open >= REVEAL_AT) return reveal();
  if (S.open >= PARTIAL_AT) return ending('partial', st.partial);
  ending('closed', st.closed);
}

function reveal(){
  S.step = 'reveal';
  const st = story();

function ending(kind, line){

function mix(a, b, t){ const p = s => [1,3,5].map(i => parseInt(s.substr(i,2),16)); const A=p(a),B=p(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }

    emoteT += dt;
    const y = baseY - 12 - Math.min(4, emoteT / 120);
    const show = emoteT < 2600 || S.screen === 'end';
    if (show){
      g.fillStyle = '#f3e9dc'; g.fillRect(herX + 7, y - 1, 11, 9); g.fillRect(herX + 10, y + 8, 2, 2);
      g.fillStyle = '#0b0910'; g.fillRect(herX + 7, y - 2, 11, 1); g.fillRect(herX + 7, y + 8, 11, 1); g.fillRect(herX + 6, y - 1, 1, 9); g.fillRect(herX + 18, y - 1, 1, 9);
      if (emote === 'heart') icon(HEART, herX + 9, y + 1, '#ff7a93');
      if (emote === 'cloud') icon(CLOUD, herX + 9, y + 1, '#5b6d94');
      if (emote === 'dots') icon(DOTS, herX + 9, y + 1, '#2a1b2a');
    }
  }
  // title vignette text
  if (S.screen === 'title'){
    g.fillStyle = 'rgba(11,9,16,.55)'; g.fillRect(0, 94, W, 14);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- boot (keeps progress across live updates) ----------
window.claude?.hot?.snapshot?.(() => ({done: S.done}));
function boot(data){
  if (data && data.done) S.done = data.done;
  title();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
