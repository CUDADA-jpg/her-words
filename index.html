<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>她想说的话</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1 class="tab on">她想说的话</h1>
  </header>

  <div class="stage px">
    <canvas id="cv" width="192" height="108" aria-label="夜晚的房间，你和她站在两端"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="chip">心门 <span class="bar" id="bar"></span></div>
      <div class="chip">耐心 <span class="hearts" id="hearts"></span></div>
      <div class="chip">ROUND <b id="rnd">1/4</b></div>
    </div>
  </div>

  <div class="tools"><button class="menu" id="menuBtn" hidden>≡ 选择夜晚</button></div>

  <div class="clues" id="clues" hidden></div>

  <section class="box px" id="box" aria-live="polite"></section>

  <footer>数字键 1–4 选择 · 空格 / 回车 继续</footer>
</div>

<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
